<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="6AM — Não Deixe Entrar. Um jogo de terror pixel art sobre uma criança sozinha em casa enquanto algo aprende como entrar.">
  <title>6AM — Não Deixe Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">6AM <span>— NÃO DEIXE ENTRAR</span></div>
      <div class="status">HTML5 / PIXEL HORROR</div>
    </header>
    <main>
      <canvas id="game" width="480" height="270" aria-label="Jogo 6AM — Não Deixe Entrar"></canvas>
      <div class="controls">
        <span><b>WASD</b> mover</span>
        <span><b>E</b> reforçar entrada</span>
        <span><b>F</b> lanterna</span>
        <span><b>P</b> pausa</span>
        <span><b>R</b> reiniciar após morte</span>
      </div>
    </main>
    <footer>Desenvolvido para rodar direto no navegador e no GitHub Pages.</footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
