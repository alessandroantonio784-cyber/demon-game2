<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="6AM — um jogo de terror pixel art sobre uma criança sozinha em casa e algo que quer entrar.">
  <title>6AM — Não Deixe Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <div class="brandline">
      <div class="brand"><span class="mark">6</span>AM <i>— NÃO DEIXE ENTRAR</i></div>
      <div class="build">NIGHT 01 · PROTOTYPE V2</div>
    </div>
    <section class="screen-wrap">
      <canvas id="game" width="768" height="432" aria-label="Jogo 6AM — Não Deixe Entrar"></canvas>
      <div class="crt"></div>
      <div class="noise"></div>
    </section>
    <div class="help">
      <span><b>WASD</b> mover</span>
      <span><b>E</b> trancar / reparar</span>
      <span><b>F</b> lanterna</span>
      <span><b>Q</b> observar</span>
      <span><b>P</b> pausa</span>
    </div>
    <div class="foot">Sem bibliotecas externas · funciona no GitHub Pages · áudio gerado no navegador</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
